<div class="flex flex-col gap-2 mt-4 animate-fade-in-up">
    <h4 class="text-[10px] uppercase tracking-widest text-scifi-muted mb-1">Upcoming Uplinks</h4>
    {% if bookings %}
    <div class="space-y-2 max-h-32 overflow-y-auto pr-2 custom-scrollbar">
        {% for b in bookings %}
        <div class="flex justify-between items-center bg-white/40 p-2 rounded border border-white/50 text-xs">
            <span class="font-bold text-gray-700">{{ b.user.username }}</span>
            <span class="font-mono text-gray-500">{{ b.start_time.strftime('%H:%M') }} - {{ b.end_time.strftime('%H:%M')
                }}</span>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-xs text-gray-400 italic">No scheduled uplinks. System idle.</div>
    {% endif %}
</div>
