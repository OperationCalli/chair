<div class="relative w-full h-full flex items-center justify-center animate-fade-in">

    <!-- FLOOR GLOW (Red/Orange if expiring soon, else Cyan) -->
    <div
        class="absolute bottom-[20%] w-[300px] h-[60px] {% if is_warning %}bg-red-500/10{% else %}bg-blue-500/10{% endif %} blur-[50px] rounded-full transition-colors duration-1000">
    </div>

    <div class="relative z-10 transform scale-110">

        <!-- CHAIR (Occupied) -->
        <!-- Profile Picture "Sitting" in the chair -->
        <!-- Logic: Absolute position 'behind' the desk but 'on' the chair -->
        <div class="absolute top-[40px] left-1/2 -translate-x-1/2 z-10 flex flex-col items-center">
            <!-- PFP Halo/Glow -->
            <div class="relative">
                <div class="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full blur opacity-30">
                </div>
                <img src="{{ current_booking.user.profile_image_url }}" alt="Occupant"
                    class="relative w-24 h-24 rounded-full border-4 border-white shadow-xl object-cover bg-gray-100">
            </div>
        </div>

        <div
            class="absolute top-[20px] left-1/2 -translate-x-1/2 w-32 h-40 bg-white border border-gray-200 rounded-t-3xl shadow-lg opacity-80 desk-chair-back">
        </div>
        <div
            class="absolute top-[140px] left-1/2 -translate-x-1/2 w-36 h-32 bg-gray-50 border border-gray-200 rounded-xl shadow-md desk-chair-seat">
        </div>

        <!-- DESK SURFACE -->
        <div
            class="absolute top-[100px] left-1/2 -translate-x-1/2 w-[400px] h-[120px] bg-gradient-to-b from-white to-gray-50 border border-white rounded-2xl shadow-glass transform rotate-x-12 perspective-lg z-30 flex flex-col items-center justify-center gap-1">

            <!-- NAMEPLATE -->
            <div class="px-5 py-2 bg-black/5 backdrop-blur-sm rounded-lg border border-white/20 shadow-inner">
                <span class="text-sm font-bold tracking-widest text-gray-800 uppercase">{{ current_booking.user.username
                    }}</span>
            </div>

            <!-- TIMER -->
            <div class="text-xs font-mono text-gray-500 mt-1 flex items-center gap-2">
                <svg class="w-3 h-3 {% if is_warning %}text-red-500 animate-pulse{% endif %}" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span id="booking-timer" class="{% if is_warning %}text-red-600 font-bold{% endif %}">
                    {{ time_remaining_str }}
                </span>
            </div>

        </div>
    </div>
</div>
