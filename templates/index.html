<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chair OS | Resource Booking</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/ws.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'scifi-white': '#F8F9FA',
                        'scifi-glass': 'rgba(255, 255, 255, 0.7)',
                        'scifi-border': 'rgba(0, 240, 255, 0.3)',
                        'scifi-glow': '#00F0FF',
                        'scifi-text': '#1A1A1A',
                        'scifi-muted': '#8A8A9A',
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'glow': '0 0 15px rgba(0, 240, 255, 0.2)',
                    },
                    backdropBlur: {
                        'xs': '2px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }

        .desk-iso {
            /* Placeholder for desk image positioning */
            transform-style: preserve-3d;
        }
    </style>
</head>

<body class="text-scifi-text font-sans antialiased overflow-hidden">

    <div class="flex h-screen w-full relative">

        <!-- Main Dashboard Area -->
        <main class="flex-1 flex flex-col relative z-10 p-8 items-center justify-center">

            <!-- Header -->
            <header class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-20">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-scifi-glow shadow-glow animate-pulse"></div>
                    <h1 class="text-xl font-bold tracking-widest uppercase text-gray-800">Chair<span
                            class="text-cyan-500">OS</span></h1>
                </div>
                <div class="flex gap-4">
                    {% if user %}
                    <div class="flex items-center gap-2 glass-panel px-4 py-2 rounded-full">
                        <span class="text-sm font-medium">{{ user.username }}</span>
                        <img src="{{ user.profile_image_url }}"
                            class="w-8 h-8 rounded-full border border-gray-200 object-cover">
                    </div>
                    {% else %}
                    <a href="/login"
                        class="px-6 py-2 glass-panel rounded-full hover:bg-white transition-all text-sm font-semibold uppercase tracking-wide">Login</a>
                    {% endif %}
                </div>
            </header>

            <!-- CENTRAL VISUAL METAPHOR: The Desk -->
            <!-- This container will be swapped via HTMX based on state -->
            <div id="desk-visual-container" hx-get="/desk-status" hx-trigger="load, every 2s"
                class="relative w-[600px] h-[600px] flex items-center justify-center transition-all duration-500">

                <!-- Initial Loading State -->
                <div class="animate-pulse flex flex-col items-center">
                    <div class="w-64 h-4 bg-gray-200 rounded mb-4"></div>
                    <div class="text-scifi-muted tracking-[0.2em] text-xs">MAINTAINING UPLINK...</div>
                </div>

            </div>

            <!-- Booking Controls -->
            <div
                class="absolute bottom-10 left-1/2 transform -translate-x-1/2 glass-panel p-6 rounded-2xl w-full max-w-md">
                <h3 class="text-xs uppercase tracking-widest text-scifi-muted mb-4 text-center">Resource Allocation</h3>
                <form hx-post="/book" hx-swap="none" class="flex gap-2">
                    <input type="number" name="duration" placeholder="Mins needed..."
                        class="flex-1 bg-white/50 border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-scifi-glow transition-colors">
                    <button type="submit"
                        class="bg-black text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors shadow-lg shadow-gray-200/50">Details</button>
                    <!-- Actual submit implies booking logic -->
                </form>
                <div id="booking-message" class="mt-2 text-xs text-center h-4 text-cyan-600"></div>
            </div>

        </main>

        <!-- Right Side Chat Panel -->
        <aside class="w-80 glass-panel border-l border-white/50 h-full flex flex-col relative z-20 shadow-xl"
            hx-ext="ws" ws-connect="/ws/{{ user.id if user else 0 }}">
            <div class="p-4 border-b border-gray-100/50 flex justify-between items-center">
                <h2 class="text-xs font-bold uppercase tracking-widest text-gray-500">Comms Link</h2>
                <span class="w-2 h-2 bg-green-400 rounded-full shadow-[0_0_10px_rgba(74,222,128,0.5)]"></span>
            </div>

            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Messages will be appended here via WebSocket OOB swaps -->
                {% if user %}
                <div class="text-center text-xs text-gray-400 my-4">-- Connected as {{ user.username }} --</div>
                {% else %}
                <div class="text-center text-xs text-gray-400 my-4">-- Login to Chat --</div>
                {% endif %}
            </div>

            <div class="p-4 bg-white/30">
                <form ws-send class="flex gap-2">
                    <input type="text" name="message" placeholder="Transmit..."
                        class="w-full bg-white/80 border-0 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-cyan-300 placeholder-gray-400 transition-all"
                        {% if not user %}disabled{% endif %} autocomplete="off">
                </form>
            </div>
        </aside>

    </div>

</body>

</html>
